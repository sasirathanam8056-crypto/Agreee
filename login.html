<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    
    <div id="id01" class="modal">
  
  <form class="modal-content animate" id="nextBtn">
    <div class="imgcontainer">
      <span onclick="document.getElementById('id01').style.display='none'" class="close" title="Close Modal">&times;</span>
      <img src="../images/three.webp" alt="Avatar" class="avatar">
    </div>

    <div class="container">
      <label for="uname"><b>Username</b></label>
      <input type="text" placeholder="Enter Username" name="uname" required>

      <label for="psw"><b>Password</b></label>
      <input type="password" placeholder="Enter Password" name="psw" required>
        
      <button type="submit">Login</button>
      <label> 
        <input type="checkbox" checked="checked" name="remember" style="margin-top: 20px;"> Remember me
      </label>
    </div>
     
    <div class="social-container">

  <div class="divider">
    <span>or</span>
  </div>

  <button class="google-btn">
    <img src="../images/google_PNG19630.png">
    Continue with Google
  </button>

  <button class="facebook-btn">
    <img src="../images/facebook.png">
    Continue with Facebook
  </button>

  <p class="signup">
    Don't have an account?
    <a href="#">Sign up</a>
  </p>

</div>

    <div class="container" style="background-color:#f1f1f1">
      <button type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelbtn">Cancel</button>
      <span class="psw">Forgot <a href="#">password?</a></span>
    </div>
  </form>
</div>

<script src="../js/login.js"></script>
</body>
</html>
